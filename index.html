<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approval Slip 想要清单审批</title>
<script>try{const t=JSON.parse(localStorage.getItem('theme'));document.documentElement.dataset.theme=['paper','grove','blue','bluegreen','cyber'].includes(t)?t:'paper'}catch(e){document.documentElement.dataset.theme='paper'}</script>
<style>
:root{
  --paper:#f4f5f2; --card:#fffffd; --ink:#1d2327; --muted:#69727a; --line:#d5d9d6;
  --wait:#a88e50; --ok:#1f7a4d; --no:#b3342b; --tie:#566a8a; --accent:#26406b;
  --field:#fff; --side:#f3f4f1; --btn-bg:#1d2327; --btn-fg:#fff; --on-accent:#fff; --on-sig:#fff;
  --banner-bg:#fdf3e1; --banner-line:#e7c98a;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",STSong,SimSun,serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
[data-theme=grove]{--paper:#F7F3EA;--card:#FFFCF7;--ink:#40594C;--muted:#7E8D82;--line:#DCE7DC;--wait:#A9BDA9;--ok:#36875A;--no:#cea953;--on-no:#302B20;--tie:#58758F;--accent:#688D75;--field:#FFFCF7;--side:#EAF0E8;--btn-bg:#557A64;--btn-fg:#fff;--on-sig:#fff;--banner-bg:#F1F2E8;--banner-line:#C9D8C8}
[data-theme=blue]{--paper:#F2F6FA;--card:#FFFFFF;--ink:#344B66;--muted:#71849A;--line:#D8E2EC;--wait:#A3B5CF;--ok:#397BB8;--no:#c59b39;--on-no:#302B20;--tie:#527C9F;--accent:#477EAE;--field:#FFFFFF;--side:#EAF1F7;--btn-bg:#315F8D;--btn-fg:#fff;--on-sig:#fff;--banner-bg:#EDF3F8;--banner-line:#C7D7E6}
[data-theme=cyber]{--paper:#08080e;--card:#11111b;--ink:#eaeaf2;--muted:#9a9fb8;--line:#2b2b44;--wait:#fcee0a;--ok:#00ff9c;--no:#ff2a5f;--tie:#00f0ff;--accent:#fcee0a;--field:#0b0b14;--side:#181826;--btn-bg:#fcee0a;--btn-fg:#08080e;--on-accent:#08080e;--on-sig:#fff;--banner-bg:#1d1a08;--banner-line:#fcee0a;--serif:"Bahnschrift","DIN Alternate","Arial Narrow","PingFang SC","Microsoft YaHei",sans-serif}
::selection{background:var(--accent);color:var(--on-accent)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans)}
main{max-width:680px;margin:0 auto;padding:20px 16px 64px}
h1{font:700 24px/1.2 var(--sans);margin:0}
h2{font:700 18px/1.3 var(--sans);margin:28px 0 10px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.top>div{display:flex;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:13px}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--field)}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);padding:7px 14px;border-radius:4px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.35;cursor:not-allowed}
.ok{background:var(--ok);border-color:var(--ok);color:var(--on-sig)}.no{background:var(--no);border-color:var(--no);color:var(--on-no,var(--on-sig))}
button.ok{color:#fff}button.no{color:var(--on-no,var(--on-sig))}
.row{display:flex;gap:12px}.row>*{flex:1}
.hm{display:flex;align-items:center;gap:6px}.hm input{width:72px}.hm i{font-style:normal;color:var(--muted);font-size:13px}
.kinds{display:flex;gap:8px}
.kinds label{margin:0;flex:1;display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--field);color:var(--ink);font-size:17px;font-weight:400}
.kinds input{width:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
fieldset{border:1px solid var(--line);border-radius:4px;margin:14px 0 0;padding:4px 12px 12px}
legend{padding:0 6px;font:700 14px var(--sans)}
nav{display:flex;gap:4px;margin:16px 0 4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:none;border-bottom:3px solid transparent;border-radius:0;color:var(--muted);padding:8px 14px;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.mbar{display:flex;gap:10px;margin-top:14px;overflow-x:auto}
.mem{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:2px solid transparent;border-radius:8px;color:var(--ink);padding:4px 8px;font-size:12px}
.mem.on{border-color:var(--accent);background:var(--card)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;flex:none;line-height:1}
.filter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0}
.filter input{width:auto}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .x{background:none;border:none;color:var(--on-accent);padding:0 0 0 4px}
.slip{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--wait);border-radius:4px;margin-bottom:8px}
.slip.ok{border-left-color:var(--ok);background:var(--card);color:var(--ink)}.slip.no{border-left-color:var(--no);background:var(--card);color:var(--ink)}.slip.tie{border-left-color:var(--tie)}
.head{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;background:none;border:none;color:var(--ink);padding:11px 14px;text-align:left}
.head .t{display:flex;align-items:center;gap:8px;font-weight:600}
.kind{flex:none;font:600 13px/1.2 var(--sans);padding:2px 6px;border:0.5px solid var(--accent);border-radius:4px;background:transparent;color:var(--accent);letter-spacing:1px}
.sub{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.hd{display:flex;gap:8px;align-items:center;margin-top:8px}
.badge{font-size:12px;border:1.5px solid currentColor;border-radius:3px;padding:0 6px;white-space:nowrap;font-weight:700;background:none}
.badge.wait{color:var(--wait)}.badge.ok{color:var(--ok)}.badge.no{color:var(--no)}.badge.tie{color:var(--tie)}
.body{padding:0 14px 14px;border-top:1px dashed var(--line)}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:10px;font-size:13px;color:var(--muted)}
.tag{border:1px solid var(--wait);color:var(--wait);border-radius:3px;padding:0 5px;font-size:12px}
.why{margin:8px 0}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:var(--side);border-radius:4px;padding:8px 10px;margin-top:6px}
.side p{margin:4px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.cd{font-weight:600;font-variant-numeric:tabular-nums;color:var(--wait);margin-right:auto}
.votes{margin-top:8px}.vote{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.vote p{margin:2px 0 0}
details.old{margin-top:10px;border:1px dashed var(--line);border-radius:4px;padding:6px 10px}
.err{color:var(--no);min-height:1.4em;font-size:13px;margin-top:8px}.msg{color:var(--ok)}
.empty{color:var(--muted);padding:12px 0}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.mrow b{margin-right:auto}
.emojis{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.emojis button{background:var(--field);border:1px solid var(--line);font-size:20px;padding:2px 8px}
.banner{background:var(--banner-bg);border:1px solid var(--banner-line);border-radius:4px;padding:8px 12px;margin-top:12px;font-size:14px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme{display:block;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);padding:10px;border-radius:6px}
.theme[aria-pressed=true]{border-color:var(--accent)}
.sw{display:flex;gap:4px;margin-bottom:6px}.sw i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(128,128,128,.4)}

[data-theme=cyber]{
  color-scheme:dark;
  --paper:#0D0D0D;--card:rgba(20,20,20,.94);--ink:#E0E0E0;--muted:#A0A0A0;--line:#383838;
  --wait:#FCEE0A;--ok:#008F63;--no:#FF003C;--tie:#00F0FF;--accent:#FCEE0A;
  --field:rgba(0,0,0,.72);--side:rgba(0,0,0,.52);--btn-bg:#FCEE0A;--btn-fg:#0D0D0D;
  --on-accent:#0D0D0D;--on-sig:#fff;--banner-bg:#211C06;--banner-line:#FCEE0A;
  --serif:"Bahnschrift","DIN Alternate","Arial Narrow","PingFang SC","Microsoft YaHei",sans-serif;
}
[data-theme=cyber] body{
  background-color:#0D0D0D;
  background-image:radial-gradient(ellipse 60% 40% at 15% 0,rgba(0,240,255,.14),transparent),radial-gradient(ellipse 50% 40% at 100% 0,rgba(255,0,60,.12),transparent);
  background-attachment:fixed;letter-spacing:.025em;
}
/* Fine LED pixel matrix and visible CRT scanlines */
[data-theme=cyber] body::before{
  content:"";position:fixed;inset:0;z-index:98;pointer-events:none;
  background-image:radial-gradient(rgba(0,240,255,.32) .65px,transparent .9px);
  background-size:4px 4px;opacity:.19;mix-blend-mode:screen;
}
[data-theme=cyber] body::after{
  content:"";position:fixed;inset:0;z-index:99;pointer-events:none;
  background-image:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.22) 50%),linear-gradient(90deg,rgba(255,0,0,.035),rgba(0,255,0,.012),rgba(0,0,255,.035));
  background-size:100% 4px,3px 100%;
}
[data-theme=cyber] .top{
  background:#FCEE0A;color:#0D0D0D;padding:12px 14px;margin:0 -2px 14px;
  border-bottom:4px solid #00F0FF;box-shadow:0 4px 18px rgba(0,240,255,.12);
}
[data-theme=cyber] h1{color:#0D0D0D;letter-spacing:.1em;text-shadow:2px 2px 0 rgba(0,240,255,.55)}
[data-theme=cyber] h1::before{content:"> ";color:#FF003C}
[data-theme=cyber] h2,[data-theme=cyber] legend{color:#00F0FF;letter-spacing:.08em;text-transform:uppercase}
[data-theme=cyber] h2{border-bottom:1px solid #00F0FF;padding-bottom:5px}
[data-theme=cyber] label{color:#FCEE0A}
[data-theme=cyber] .panel{
  background:rgba(20,20,20,.90);border-top:2px solid #00F0FF;border-left:2px solid #FF003C;
  box-shadow:5px 5px 0 rgba(0,0,0,.42);
}
[data-theme=cyber] .slip{background:rgba(20,20,20,.94);border-top-color:#383838;border-right-color:#383838;border-bottom-color:#383838;border-left-width:5px}
[data-theme=cyber] input,[data-theme=cyber] textarea,[data-theme=cyber] select{
  background:rgba(0,0,0,.72);border-color:#383838;border-bottom:2px solid #FCEE0A;color:#E0E0E0;
  font-family:"Consolas","Courier New",monospace;caret-color:#00F0FF;
}
[data-theme=cyber] input:focus,[data-theme=cyber] textarea:focus,[data-theme=cyber] select:focus{border-color:#00F0FF;background:rgba(0,240,255,.055)}
[data-theme=cyber] button:not(.head):not(.mem){text-transform:uppercase;letter-spacing:.045em;font-weight:700}
[data-theme=cyber] :where(.actions button,#modeBtn,#out,#login,#signup){clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));border-radius:0}
[data-theme=cyber] button.ghost{background:transparent;border-color:#00F0FF;color:#00F0FF}
[data-theme=cyber] nav{border-bottom-color:#FCEE0A}
[data-theme=cyber] nav button{color:#00F0FF;font-family:"Consolas","Courier New",monospace;text-transform:uppercase}
[data-theme=cyber] nav button.on{color:#0D0D0D;background:#00F0FF;border-bottom-color:#FCEE0A;text-shadow:none}
[data-theme=cyber] .chip{background:transparent;border-color:#00F0FF;color:#00F0FF}
[data-theme=cyber] .chip.on{background:#00F0FF;color:#0D0D0D}
[data-theme=cyber] .chip .x{color:#0D0D0D}
[data-theme=cyber] .badge{text-shadow:0 0 6px currentColor}
[data-theme=cyber] .head .t{letter-spacing:.04em}
[data-theme=cyber] .av{border-radius:0;clip-path:polygon(22% 0,100% 0,100% 78%,78% 100%,0 100%,0 22%)}
[data-theme=cyber] .mem.on{border-color:#FCEE0A;background:#1D1D1D}
[data-theme=cyber] .side{background:rgba(0,0,0,.48);border-left:2px solid #00F0FF}
[data-theme=cyber] .banner{background:#211C06;border-color:#FCEE0A}
[data-theme=cyber] .theme{background:#141414;color:#E0E0E0}
[data-theme=cyber] .theme[aria-pressed=true]{background:#24200B;box-shadow:inset 0 0 0 1px #FCEE0A}

/* The refresh is explicitly retriggered after each page render or theme switch. */
#view{position:relative}
[data-theme=cyber] .led-refresh{position:relative;isolation:isolate;animation:led-block-pop .62s steps(7,end) var(--led-delay,0ms) both}
@keyframes led-block-pop{0%{opacity:.25;filter:brightness(1.65) saturate(1.35);transform:translateY(7px)}18%{opacity:.72;filter:brightness(1.24)}100%{opacity:1;filter:brightness(1);transform:translateY(0)}}
@media (prefers-reduced-motion:no-preference){[data-theme=cyber] h1{animation:glitch 7s infinite steps(1)}}
@keyframes glitch{0%,92%,100%{text-shadow:2px 0 #ff003c,-2px 0 #00f0ff;transform:none}93%{text-shadow:-4px 0 #ff003c,4px 0 #00f0ff;transform:translateX(3px)}95%{text-shadow:4px 0 #00f0ff,-4px 0 #ff003c;transform:translateX(-3px)}97%{text-shadow:2px 0 #ff003c,-2px 0 #00f0ff;transform:none}}
@media (prefers-reduced-motion:reduce){
  [data-theme=cyber] .led-refresh,[data-theme=cyber] h1{animation:none!important}
}

[data-theme=cyber] :where(.panel,.slip,.side,.banner,.theme,.mem,details.old,fieldset,.chip,.badge,.kind,.tag,input,textarea,.kinds label,.emojis button){border-radius:0}
[data-theme=cyber] :where(.panel,.slip,.theme){clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
[data-theme=cyber] .panel{border-top-color:#00F0FF;border-left-color:#FF003C;border-right-color:#383838;border-bottom-color:#383838}
[data-theme=cyber] .theme{border-color:var(--accent)}
[data-theme=cyber] .theme[aria-pressed=true]{background:#1d1d2c;box-shadow:inset 0 0 0 1px var(--accent)}
[data-theme=cyber] .slip{border-top-color:var(--line);border-right-color:var(--line);border-bottom-color:var(--line);border-left-width:5px}
[data-theme=cyber] :where(.actions button,#modeBtn,#out,#login,#signup){clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));border-radius:0;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
[data-theme=cyber] button.ghost{background:transparent;border-color:var(--tie);color:var(--tie)}
[data-theme=cyber] nav{border-bottom-color:var(--accent)}
[data-theme=cyber] nav button.on{color:var(--accent);border-bottom-color:var(--accent);text-shadow:0 0 10px rgba(252,238,10,.7)}
[data-theme=cyber] .chip{background:transparent;border-color:var(--tie);color:var(--tie)}
[data-theme=cyber] .chip.on{background:var(--tie);color:#05050a}
[data-theme=cyber] .chip .x{color:#05050a}
[data-theme=cyber] .badge{text-shadow:0 0 6px currentColor}
[data-theme=cyber] .head .t{letter-spacing:.04em}
[data-theme=cyber] .av{border-radius:0;clip-path:polygon(22% 0,100% 0,100% 78%,78% 100%,0 100%,0 22%)}
[data-theme=cyber] input,[data-theme=cyber] textarea{border-color:#33334f;caret-color:var(--accent)}
[data-theme=cyber] input:focus,[data-theme=cyber] textarea:focus{border-color:var(--tie)}
[data-theme=cyber] .mem.on{border-color:var(--accent);background:#1d1d2c}
[data-theme=cyber] .side{border-left:2px solid var(--tie)}
[hidden]{display:none!important}
@media (max-width:520px){.sides{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="top">
  <h1>Approval Slip 想要清单审批</h1>
  <div><button id="modeBtn" class="ghost" data-a="mode" hidden></button><button id="out" class="ghost" hidden>退出</button></div>
</div>
<div id="banner" class="banner" hidden></div>

<section id="auth" class="panel" style="margin-top:20px" hidden>
  <label for="em">邮箱</label><input id="em" type="email" autocomplete="email">
  <label for="pw">密码（至少 6 位）</label><input id="pw" type="password" autocomplete="current-password">
  <div class="actions"><button id="login">登录</button><button id="signup" class="ghost">注册</button></div>
  <div id="autherr" class="err"></div>
</section>

<section id="app" hidden>
  <div id="mbar"></div>
  <nav id="nav"></nav>
  <div id="view"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== 只需要改这两行（Supabase 控制台 → Project Settings → API）======
const SUPABASE_URL = "https://YOUR-PROJECT-ID.supabase.co";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";   // 只能填 publishable / anon key，绝对不要填 secret / service_role
// =====================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const ls = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const DEF = { mode:"single", cooldownMin:30, deadlineMin:720, rushMin:300 };
const S = { reqs:[], members:[], votes:[], settings:{...DEF}, uid:null, email:"" };
const UI = { page: ls.get("page","apply"), open:new Set(), drafts:{}, editing:null, mEdit:null, flash:"", filter: ls.get("filter",{tag:"today",days:[]}) };
let channel = null;

// ---------- 小工具 ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fm = n => Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const dur = m => { m = Number(m)||0; const h = Math.floor(m/60), x = m%60; return (h ? h+" 小时" : "") + (h && x ? " " : "") + (x || !h ? x+" 分钟" : ""); };
const clock = ms => { const s = Math.max(0,Math.ceil(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const fmtDT = d => new Date(d).toLocaleString([], {month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const tin = (id,min) => { const h = min==null ? "" : Math.floor(min/60), m = min==null ? "" : min%60;
  return `<span class="hm"><input id="${id}_h" type="number" min="0" step="1" value="${h}" inputmode="numeric" aria-label="小时"><i>小时</i><input id="${id}_m" type="number" min="0" max="59" step="1" value="${m}" inputmode="numeric" aria-label="分钟"><i>分钟</i></span>`; };
const gtin = id => { const h = $(id+"_h").value, m = $(id+"_m").value; return h==="" && m==="" ? null : (Number(h)||0)*60 + (Number(m)||0); };
const gnum = id => $(id).value === "" ? null : Number($(id).value);
const hue = s => [...s].reduce((a,c) => a + c.charCodeAt(0), 0) * 37 % 360;
const av = (m,s=32) => { if (!m) return ""; const st = `width:${s}px;height:${s}px;font-size:${Math.round(s*.55)}px`;
  return m.avatar.startsWith("data:") ? `<img class="av" style="${st}" src="${esc(m.avatar)}" alt="">`
    : `<span class="av" style="${st};background:hsl(${hue(m.name)} 45% 88%)">${esc(m.avatar)}</span>`; };

// ---------- 状态推导 ----------
const isMulti = () => S.settings.mode === "multi";
const ready = () => !isMulti() || S.members.length >= 2;
const mem = id => S.members.find(m => m.id === id);
const me = () => mem(ls.get("me",null)) || S.members[0] || null;
const scope = () => S.reqs.filter(r => isMulti() ? !!r.member_id : !r.member_id);
const votesOf = (r, round = r.round) => S.votes.filter(v => v.request_id === r.id && v.round === round);
const isOpen = r => new Date(r.deadline_at) > Date.now();
const tally = vs => { const a = vs.filter(v => v.decision==="approve").length, b = vs.length - a; return {a, b, res: a>b ? "pass" : b>a ? "fail" : "tie"}; };
const stateOf = r => isOpen(r) ? "open" : tally(votesOf(r)).res;
const LABEL = {open:"进行中", pass:"通过", fail:"不通过", tie:"未能决定"};
const CLS = {open:"wait", pass:"ok", fail:"no", tie:"tie"};

function inFilter(r){
  const d = new Date(r.created_at), f = UI.filter, n = new Date();
  if (f.tag === "all") return true;
  if (f.tag === "today") return ymd(d) === ymd(n);
  if (f.tag === "week") return d >= new Date(n.getFullYear(), n.getMonth(), n.getDate() - ((n.getDay()+6)%7));
  if (f.tag === "month") return d >= new Date(n.getFullYear(), n.getMonth()-1, n.getDate());
  return f.days.includes(ymd(d));
}

// ---------- 登录 ----------
async function auth(kind){
  $("autherr").textContent = "";
  const email = $("em").value.trim(), password = $("pw").value;
  const { data, error } = kind === "up" ? await sb.auth.signUp({email, password}) : await sb.auth.signInWithPassword({email, password});
  if (error) { $("autherr").textContent = error.message; return; }
  if (kind === "up" && !data.session) $("autherr").textContent = "注册成功，请先去邮箱点确认链接，再回来登录。";
}
$("login").onclick = () => auth("in");
$("signup").onclick = () => auth("up");
$("out").onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((_e, session) => {
  const on = !!session;
  $("auth").hidden = on; $("app").hidden = !on; $("out").hidden = !on; $("modeBtn").hidden = !on;
  if (on && session.user.id !== S.uid) { S.uid = session.user.id; S.email = session.user.email; start(); }
  if (!on) { S.uid = null; S.reqs = []; S.members = []; S.votes = []; if (channel) { sb.removeChannel(channel); channel = null; } }
});

// ---------- 数据 ----------
function fail(error){
  const b = $("banner"); b.hidden = false;
  b.textContent = "读取失败：" + error.message + "（如果提示找不到表或列，请先运行数据库升级 SQL。）";
}
async function loadReqs(){ const {data,error} = await sb.from("requests").select("*").order("created_at",{ascending:false}); if (error) return fail(error); S.reqs = data; }
async function loadMembers(){ const {data,error} = await sb.from("members").select("*").order("created_at"); if (error) return fail(error); S.members = data; }
async function loadVotes(){ const {data,error} = await sb.from("votes").select("*"); if (error) return fail(error); S.votes = data; }
async function loadSettings(){
  const {data,error} = await sb.from("settings").select("data").maybeSingle(); if (error) return fail(error);
  S.settings = {...DEF, ...(data?.data || {})};
}
async function saveSettings(){
  const {error} = await sb.from("settings").upsert({user_id:S.uid, data:S.settings}, {onConflict:"user_id"});
  if (error) alert("保存设置失败：" + error.message);
}
async function start(){
  $("banner").hidden = true;
  await Promise.all([loadReqs(), loadMembers(), loadVotes(), loadSettings()]);
  render(true);
  channel = sb.channel("app-" + S.uid);
  [["requests",loadReqs],["members",loadMembers],["votes",loadVotes],["settings",loadSettings]].forEach(([t,fn]) =>
    channel.on("postgres_changes", {event:"*", schema:"public", table:t}, async () => { await fn(); render(false); }));
  channel.subscribe();
}

// ---------- 渲染 ----------
function pageList(){
  if (!ready()) return [["settings","设置"]];
  return isMulti()
    ? [["apply","申请"],["todo","待处理"],["done","已处理"],["public","公示"],["settings","设置"]]
    : [["apply","申请"],["review","审批"],["public","公示"],["settings","设置"]];
}
function runCyberRefresh(){
  if (document.documentElement.dataset.theme !== "cyber") return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const view = $("view");
  if (view) {
    view.classList.remove("led-refreshing");
    void view.offsetWidth;
    view.classList.add("led-refreshing");
  }
  const blocks = [...document.querySelectorAll("#view .panel, #view .slip")];
  blocks.forEach((el, index) => {
    el.classList.remove("led-refresh");
    el.style.setProperty("--led-delay", `${Math.min(index, 8) * 95}ms`);
    void el.offsetWidth;
    el.classList.add("led-refresh");
  });
}

function render(force = true){
  const pages = pageList();
  if (!pages.some(p => p[0] === UI.page)) UI.page = pages[0][0];
  $("modeBtn").textContent = "多人模式：" + (isMulti() ? "开" : "关");
  $("modeBtn").setAttribute("aria-pressed", isMulti());
  const cur = me();
  $("mbar").innerHTML = isMulti() && ready()
    ? `<div class="mbar">${S.members.map(m => `<button class="mem ${cur && cur.id===m.id ? "on" : ""}" data-a="who" data-id="${m.id}" aria-pressed="${!!cur && cur.id===m.id}">${av(m,40)}<span>${esc(m.name)}</span></button>`).join("")}</div>` : "";
  $("nav").innerHTML = pages.map(([p,l]) => `<button class="${UI.page===p ? "on" : ""}" data-a="nav" data-p="${p}">${l}</button>`).join("");
  if (!force && (UI.page === "apply" || UI.page === "settings")) return;
  const y = window.scrollY;
  $("view").innerHTML = ({apply:pgApply, review:pgReview, public:isMulti() ? pgPublicMulti : pgPublicSingle, todo:pgTodo, done:pgDone, settings:pgSettings})[UI.page]();
  window.scrollTo(0, y);
  tick();
  runCyberRefresh();
}

const nextDay = x => { const [y,m,d] = x.split("-").map(Number); return ymd(new Date(y, m-1, d+1)); };
function runs(days){
  const out = []; let cur = null;
  days.forEach(d => { if (cur && nextDay(cur.end) === d) cur.end = d; else { cur = {start:d, end:d}; out.push(cur); } });
  return out;
}
function filterBar(){
  const tags = [["today","今天"],["week","这周"],["month","过去一个月"],["all","全部"],["custom","自定义"]];
  let h = `<div class="filter">${tags.map(([t,l]) => `<button class="chip ${UI.filter.tag===t ? "on" : ""}" data-a="ftag" data-t="${t}">${l}</button>`).join("")}</div>`;
  if (UI.filter.tag === "custom") {
    h += `<div class="filter"><input type="date" id="fday" aria-label="选择某一天"><button class="ghost" data-a="fadd">添加这一天</button></div>
      <div class="filter"><input type="date" id="fstart" aria-label="开始日期"><span class="muted">至</span><input type="date" id="fend" aria-label="结束日期"><button class="ghost" data-a="fadds">添加这一段</button></div>`;
    if (UI.filter.days.length)
      h += `<div class="filter">${runs(UI.filter.days).map(x => { const t = x.start === x.end ? x.start : x.start + " 至 " + x.end;
        return `<span class="chip on">${t}<button class="x" data-a="fdel" data-s="${x.start}" data-e="${x.end}" aria-label="移除 ${t}">×</button></span>`; }).join("")}</div>`;
  }
  return h;
}
const ta = (key, ph, fallback = "") => `<textarea data-draft="${key}" placeholder="${ph}">${esc(UI.drafts[key] ?? fallback)}</textarea>`;

function detail(r){
  const m = r.member_id ? mem(r.member_id) : null;
  const side = (t, money, mins, note) => { const p = []; if (money != null) p.push("金钱 " + fm(money)); if (mins) p.push("时间 " + dur(mins));
    return `<div class="side"><b>${t}</b><div>${p.join("　") || "未填"}</div>${note ? `<p>${esc(note)}</p>` : ""}</div>`; };
  return `<div class="meta">${m ? av(m,24) + esc(m.name) + "　" : ""}提交于 ${fmtDT(r.created_at)}${r.rush ? ' <span class="tag">加急</span>' : ""}${r.round>1 ? ' <span class="tag">二审</span>' : ""}</div>
    ${r.reason ? `<p class="why">理由：${esc(r.reason)}</p>` : ""}
    <div class="sides">${side("会消耗", r.money_cost, r.time_cost_minutes, r.cost_note)}${side("会得到", r.gain_money, r.gain_time_minutes, r.gain_note)}</div>`;
}
const kindPill = k => `<span class="kind ${k}">${k === "do" ? "想做" : "不想做"}</span>`;
const durMs = ms => { const t = Math.max(0, Math.round(ms/60000)); if (t < 1) return "不到 1 分钟";
  const d = Math.floor(t/1440), h = Math.floor(t%1440/60), m = t%60;
  return [d ? d+" 天" : "", h ? h+" 小时" : "", m ? m+" 分钟" : ""].filter(Boolean).join(" "); };
function row(r, badge, cls, body, sub = ""){
  const o = UI.open.has(r.id), m = r.member_id ? mem(r.member_id) : null;
  return `<article class="slip ${cls}"><button class="head" data-a="tog" data-id="${r.id}" aria-expanded="${o}"><span class="t">${m ? av(m,26) : ""}${kindPill(r.kind)}<span>${esc(r.title)}${sub ? `<small class="sub">${sub}</small>` : ""}</span></span><span class="badge ${cls}">${badge}</span></button>${o ? `<div class="body">${body}</div>` : ""}</article>`;
}
const delBtn = r => `<button class="ghost" data-a="del" data-id="${r.id}">删除</button>`;
const empty = '<div class="empty">这个时间范围内没有内容。</div>';

// ----- 单人：审批页 / 公示页 -----
function pgReview(){
  const list = scope().filter(r => r.status === "pending" && inFilter(r)).sort((a,b) => new Date(a.review_at) - new Date(b.review_at));
  return filterBar() + (list.map(r => row(r, "待审", "wait",
    detail(r) + `<label>审批理由（必填）</label>${ta("r:"+r.id, "写下为什么通过或不通过")}
      <div class="actions"><span class="cd" data-due="${r.review_at}" data-k="cool"></span>
      <button class="ok" data-a="sdec" data-id="${r.id}" data-v="approved" disabled>通过</button>
      <button class="no" data-a="sdec" data-id="${r.id}" data-v="rejected" disabled>不通过</button>${delBtn(r)}</div>`)).join("")
    || '<div class="empty">没有待审的申请。</div>');
}
function pgPublicSingle(){
  const list = scope().filter(r => r.status !== "pending" && inFilter(r)).sort((a,b) => new Date(b.decided_at) - new Date(a.decided_at));
  return filterBar() + (list.map(r => {
    const ok = r.status === "approved", took = durMs(new Date(r.decided_at) - new Date(r.created_at));
    return row(r, ok ? "通过" : "不通过", ok ? "ok" : "no",
      detail(r) + `<p class="why">审批理由：${esc(r.decision_reason)}</p>
        <p class="muted">提交于 ${fmtDT(r.created_at)}　审批完成于 ${fmtDT(r.decided_at)}　用时 ${took}</p>
        <div class="actions">${delBtn(r)}</div>`,
      `完成于 ${fmtDT(r.decided_at)}，用时 ${took}`);
  }).join("") || empty);
}

// ----- 多人：待处理 / 已处理 / 公示 -----
function pgTodo(){
  const cur = me(); if (!cur) return empty;
  const list = scope().filter(r => r.member_id !== cur.id && isOpen(r) && !votesOf(r).some(v => v.member_id === cur.id) && inFilter(r))
    .sort((a,b) => (b.rush - a.rush) || (new Date(a.deadline_at) - new Date(b.deadline_at)));
  return filterBar() + (list.map(r => row(r, r.rush ? "加急" : "待处理", "wait",
    detail(r) + `<label>你的理由（必填）</label>${ta("r:"+r.id, "写下为什么通过或不通过")}
      <div class="actions"><span class="cd" data-due="${r.deadline_at}" data-k="dl"></span>
      <button class="ok" data-a="vote" data-id="${r.id}" data-v="approve">通过</button>
      <button class="no" data-a="vote" data-id="${r.id}" data-v="reject">不通过</button></div>`)).join("") || empty);
}
function pgDone(){
  const cur = me(); if (!cur) return empty;
  const mine = S.votes.filter(v => v.member_id === cur.id).map(v => ({v, r:S.reqs.find(r => r.id === v.request_id)}))
    .filter(x => x.r && x.v.round === x.r.round && inFilter(x.r)).sort((a,b) => new Date(b.v.created_at) - new Date(a.v.created_at));
  return filterBar() + (mine.map(({v,r}) => {
    const ok = v.decision === "approve", open = isOpen(r);
    return row(r, ok ? "我通过了" : "我不通过", ok ? "ok" : "no",
      detail(r) + (open
        ? `<label>我的理由（可修改）</label>${ta("r:"+r.id, "", v.reason)}
           <div class="actions"><span class="cd" data-due="${r.deadline_at}" data-k="dl"></span>
           <button class="ok" data-a="vote" data-id="${r.id}" data-v="approve">改为通过</button>
           <button class="no" data-a="vote" data-id="${r.id}" data-v="reject">改为不通过</button>
           <button class="ghost" data-a="unvote" data-id="${r.id}">撤回审批</button></div>`
        : `<p class="why">我的理由：${esc(v.reason)}<br><span class="muted">已截止，不能再修改。</span></p>`));
  }).join("") || empty);
}
function voteList(r, round){
  const vs = votesOf(r, round);
  return `<div class="votes">${S.members.filter(m => m.id !== r.member_id).map(m => {
    const v = vs.find(x => x.member_id === m.id);
    return `<div class="vote">${av(m,28)}<div><b>${esc(m.name)}</b> ${v ? `<span class="badge ${v.decision==="approve" ? "ok" : "no"}">${v.decision==="approve" ? "通过" : "不通过"}</span><p>${esc(v.reason)}</p>` : '<span class="muted">未表态</span>'}</div></div>`;
  }).join("")}</div>`;
}
function pgPublicMulti(){
  const cur = me();
  const list = scope().filter(inFilter).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  return filterBar() + (list.map(r => {
    const st = stateOf(r), t = tally(votesOf(r)), mine = cur && cur.id === r.member_id;
    const old = (r.history || []).map(h => `<details class="old"><summary>一审记录（${LABEL[tally(votesOf(r,h.round)).res]}）</summary><div class="hd">${kindPill(h.kind)}<b>${esc(h.title)}</b></div>${detail(h)}${voteList(r,h.round)}</details>`).join("");
    const canAppeal = mine && st !== "open" && st !== "pass" && r.round === 1;
    return row(r, LABEL[st], CLS[st], detail(r) +
      `<p class="why">${st === "open" ? `<span class="cd" data-due="${r.deadline_at}" data-k="dl"></span>　` : `已截止　`}通过 ${t.a} 票，不通过 ${t.b} 票</p>` +
      voteList(r, r.round) + old +
      `<div class="actions">${canAppeal ? `<button data-a="appeal" data-id="${r.id}">申请二审</button>` : ""}${mine ? delBtn(r) : ""}</div>`);
  }).join("") || empty);
}

const toAvatar = file => new Promise(res => {
  const img = new Image(), rd = new FileReader();
  rd.onload = () => { img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = 96; const s = Math.min(img.width, img.height);
    c.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 96, 96); res(c.toDataURL("image/jpeg", .8)); }; img.src = rd.result; };
  rd.readAsDataURL(file);
});

// ---------- 倒计时 ----------
const snap = {};
function tick(){
  document.querySelectorAll(".cd").forEach(el => {
    const left = new Date(el.dataset.due) - Date.now();
    if (el.dataset.k === "cool") {
      const btns = el.parentElement.querySelectorAll("button.ok,button.no");
      if (left > 0) { el.textContent = "再等 " + clock(left); btns.forEach(b => b.disabled = true); }
      else { el.textContent = "可以审批了"; btns.forEach(b => b.disabled = false); }
    } else el.textContent = left > 0 ? "距截止 " + clock(left) : "已截止";
  });
  if (isMulti()) {
    let changed = false;
    scope().forEach(r => { const o = isOpen(r); if (snap[r.id] !== undefined && snap[r.id] !== o) changed = true; snap[r.id] = o; });
    if (changed) render(false);
  }
}
setInterval(tick, 1000);

// ---------- 交互 ----------
const refresh = async (...fns) => { await Promise.all(fns.map(f => f())); render(false); };

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.draft) UI.drafts[t.dataset.draft] = t.value;
  else if (t.id === "mname" && UI.mEdit) UI.mEdit.name = t.value;
  else if (t.id === "memoji" && UI.mEdit) UI.mEdit.avatar = t.value.trim() || "🙂";
});
document.addEventListener("change", async e => {
  if (e.target.id === "mfile" && e.target.files[0] && UI.mEdit) { UI.mEdit.avatar = await toAvatar(e.target.files[0]); render(true); }
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id, r = id && S.reqs.find(x => x.id === id);
  if (a === "nav") { UI.page = b.dataset.p; UI.flash = ""; ls.set("page", UI.page); return render(true); }
  if (a === "tog") { UI.open.has(id) ? UI.open.delete(id) : UI.open.add(id); return render(true); }
  if (a === "ftag") { UI.filter.tag = b.dataset.t; ls.set("filter", UI.filter); return render(true); }
  if (a === "fadd") { const d = $("fday").value; if (d && !UI.filter.days.includes(d)) { UI.filter.days.push(d); UI.filter.days.sort(); ls.set("filter", UI.filter); render(true); } return; }
  if (a === "fdel") { const s0 = b.dataset.s, e0 = b.dataset.e; UI.filter.days = UI.filter.days.filter(d => d < s0 || d > e0); ls.set("filter", UI.filter); return render(true); }
  if (a === "fadds") {
    let s0 = $("fstart").value, e0 = $("fend").value; if (!s0 || !e0) return alert("请选择开始日期和结束日期。");
    if (s0 > e0) [s0, e0] = [e0, s0];
    const set = new Set(UI.filter.days); let d = s0, n = 0;
    while (d <= e0 && n++ < 366) { set.add(d); d = nextDay(d); }
    UI.filter.days = [...set].sort(); ls.set("filter", UI.filter); return render(true);
  }
  if (a === "theme") {
    const t = b.dataset.t; document.documentElement.dataset.theme = t; ls.set("theme", t);
    document.querySelectorAll(".theme").forEach(x => x.setAttribute("aria-pressed", x.dataset.t === t));
    runCyberRefresh(); return;
  }
  if (a === "who") { ls.set("me", id); return render(true); }
  if (a === "mode") {
    S.settings.mode = isMulti() ? "single" : "multi"; await saveSettings();
    if (isMulti() && S.members.length < 2) UI.page = "settings";
    return render(true);
  }
  if (a === "del") { if (confirm("删除这条申请？")) { await sb.from("requests").delete().eq("id", id); await refresh(loadReqs, loadVotes); } return; }

  // 单人审批
  if (a === "sdec") {
    const reason = (UI.drafts["r:"+id] || "").trim();
    if (!reason) return alert("请先写下审批理由。");
    if (new Date(r.review_at) > Date.now()) return;
    const {error} = await sb.from("requests").update({status:b.dataset.v, decision_reason:reason, decided_at:new Date().toISOString()}).eq("id", id);
    if (error) return alert("操作失败：" + error.message);
    delete UI.drafts["r:"+id]; return refresh(loadReqs);
  }

  // 多人投票
  if (a === "vote") {
    const m = me(); if (!m || !r) return;
    if (r.member_id === m.id) return alert("不能审批自己的申请。");
    if (!isOpen(r)) return alert("这条申请已经截止。");
    const old = votesOf(r).find(v => v.member_id === m.id);
    const reason = (UI.drafts["r:"+id] ?? old?.reason ?? "").trim();
    if (!reason) return alert("请先写下理由。");
    const {error} = await sb.from("votes").upsert({request_id:id, member_id:m.id, round:r.round, decision:b.dataset.v, reason}, {onConflict:"request_id,round,member_id"});
    if (error) return alert("操作失败：" + error.message);
    delete UI.drafts["r:"+id]; return refresh(loadVotes);
  }
  if (a === "unvote") {
    const m = me(); if (!m || !r || !isOpen(r)) return;
    await sb.from("votes").delete().eq("request_id", id).eq("member_id", m.id).eq("round", r.round);
    delete UI.drafts["r:"+id]; return refresh(loadVotes);
  }
  if (a === "appeal") { UI.editing = id; UI.page = "apply"; UI.flash = ""; return render(true); }
  if (a === "cancelappeal") { UI.editing = null; return render(true); }

  // 设置与成员
  if (a === "saveset") {
    const c = gtin("cd"), d = gtin("dl"), s = gtin("rs");
    if (!c || !d || !s || c < 1 || d < 1 || s < 1) { $("seterr").textContent = "三个时间都要填写，且至少 1 分钟。"; return; }
    S.settings = {...S.settings, cooldownMin:c, deadlineMin:d, rushMin:s};
    await saveSettings(); $("seterr").textContent = ""; return render(true);
  }
  if (a === "madd") { UI.mEdit = {id:null, name:"", avatar:"🙂"}; return render(true); }
  if (a === "medit") { const m = mem(id); UI.mEdit = {id, name:m.name, avatar:m.avatar}; return render(true); }
  if (a === "mcancel") { UI.mEdit = null; return render(true); }
  if (a === "pickemoji") { UI.mEdit.avatar = b.dataset.e; return render(true); }
  if (a === "msave") {
    const E = UI.mEdit, name = (E.name || "").trim();
    if (!name) { $("merr").textContent = "请填写昵称。"; return; }
    const row = {name, avatar:E.avatar || "🙂"};
    const {error} = E.id ? await sb.from("members").update(row).eq("id", E.id) : await sb.from("members").insert(row);
    if (error) { $("merr").textContent = error.message; return; }
    UI.mEdit = null; await Promise.all([loadMembers()]); return render(true);
  }
  if (a === "mdel") {
    if (!confirm("删除这位成员？他提交的申请和投票也会一起删除。")) return;
    await sb.from("members").delete().eq("id", id);
    await Promise.all([loadMembers(), loadReqs(), loadVotes()]); return render(true);
  }
});

// 提交申请 / 二审
document.addEventListener("submit", async e => {
  if (e.target.id !== "f") return;
  e.preventDefault(); $("formerr").textContent = "";
  const f = {
    kind: document.querySelector("input[name=kind]:checked").value,
    title: $("title").value.trim(), reason: $("reason").value.trim() || null,
    money_cost: gnum("cm"), time_cost_minutes: gtin("ct"), cost_note: $("cn").value.trim() || null,
    gain_money: gnum("gm"), gain_time_minutes: gtin("gt"), gain_note: $("gn").value.trim() || null
  };
  const multi = isMulti(), cur = me();
  if (multi && !cur) { $("formerr").textContent = "请先选择一个成员身份。"; return; }
  let error;
  if (UI.editing) {
    const r = S.reqs.find(x => x.id === UI.editing), rush = !!$("rush")?.checked;
    const shot = {id:r.id, member_id:r.member_id, created_at:r.created_at, round:r.round, rush:r.rush, deadline_at:r.deadline_at,
      kind:r.kind, title:r.title, reason:r.reason, money_cost:r.money_cost, time_cost_minutes:r.time_cost_minutes,
      gain_money:r.gain_money, gain_time_minutes:r.gain_time_minutes, cost_note:r.cost_note, gain_note:r.gain_note};
    ({error} = await sb.from("requests").update({...f, rush, round:2, history:[...(r.history || []), shot],
      deadline_at:new Date(Date.now() + (rush ? S.settings.rushMin : S.settings.deadlineMin)*60000).toISOString()}).eq("id", r.id));
    if (!error) { UI.editing = null; UI.page = "public"; UI.flash = ""; ls.set("page","public"); }
  } else if (multi) {
    const rush = !!$("rush").checked;
    ({error} = await sb.from("requests").insert({...f, member_id:cur.id, rush,
      deadline_at:new Date(Date.now() + (rush ? S.settings.rushMin : S.settings.deadlineMin)*60000).toISOString()}));
    if (!error) UI.flash = "已提交，等其他成员审批。";
  } else {
    ({error} = await sb.from("requests").insert({...f, review_at:new Date(Date.now() + S.settings.cooldownMin*60000).toISOString()}));
    if (!error) UI.flash = "已提交，冷静时间结束后去审批页处理。";
  }
  if (error) { $("formerr").textContent = "提交失败：" + error.message; return; }
  await loadReqs(); render(true);
});
</script>
</body>
